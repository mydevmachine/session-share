version: 2
project_name: session-share

before:
  hooks:
    - go mod tidy

builds:
  - id: session-share
    binary: session-share
    main: ./cmd/session-share
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - id: default
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-dev"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"

brews:
  - name: session-share
    repository:
      owner: mydevmachine
      name: homebrew-tap
      token: '{{ envOrDefault "TAP_GITHUB_TOKEN" "" }}'
    skip_upload: '{{ if eq (envOrDefault "TAP_GITHUB_TOKEN" "") "" }}true{{ else }}false{{ end }}'
    homepage: https://github.com/mydevmachine/session-share
    description: Share a running tmux session for a limited time, in a browser or over SSH
    license: MIT
    dependencies:
      - name: tmux
    test: |
      system "#{bin}/session-share", "version"

release:
  github:
    owner: mydevmachine
    name: session-share
  prerelease: auto
